name: Verify

on:
  push:
    branches: [master, "fix/**", "feat/**"]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check git whitespace errors
        shell: bash
        run: |
          TARGET="${{ github.sha }}"

          check_range() {
            local base="$1"
            local target="$2"

            if git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
              git diff --check "$base" "$target"
              return
            fi

            echo "::warning::Whitespace baseline $base is unavailable; checking only $target against its parent."
            local parent
            parent="$(git rev-parse --verify "${target}^" 2>/dev/null || true)"
            if [ -n "$parent" ]; then
              git diff --check "$parent" "$target"
            else
              local empty_tree
              empty_tree="$(git hash-object -t tree /dev/null)"
              git diff --check "$empty_tree" "$target"
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            check_range "${{ github.event.pull_request.base.sha }}" "$TARGET"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              EMPTY_TREE=$(git hash-object -t tree /dev/null)
              git diff --check "$EMPTY_TREE" "$TARGET"
            else
              check_range "$BEFORE" "$TARGET"
            fi
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Integration tests
        run: npm run test:integration

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
